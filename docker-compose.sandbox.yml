services:
  webchat:
    environment:
      SANDBOX_ENABLED: "true"
      SANDBOX_SERVER_URL: ${SANDBOX_SERVER_URL:?Set SANDBOX_SERVER_URL to a ws:// or wss:// URL reachable by the Agent container}
      SANDBOX_STATE_DIR: ${SANDBOX_STATE_DIR:-/var/lib/yeaft/container-agents}
      SANDBOX_AGENT_IMAGE: ${SANDBOX_AGENT_IMAGE:-ghcr.io/yeaft/yeaft-web-code-agent-agent:dev}
      # Optional: shared cgroup slice created on the Host by the absolute
      # Node/CLI command printed by `yeaft-agent container setup-limits`.
      # When set, every sandbox container joins the slice and the sum of their
      # CPU/memory usage is capped (90% CPU / 70% memory by default).
      SANDBOX_CGROUP_PARENT: ${SANDBOX_CGROUP_PARENT:-}
    volumes:
      # Opt-in only: Docker socket access is equivalent to root on the Host.
      - /var/run/docker.sock:/var/run/docker.sock
      # The child Docker daemon resolves bind sources on the Host, so this path
      # must be identical inside the Server container and on the Host.
      - ${SANDBOX_STATE_DIR:-/var/lib/yeaft/container-agents}:${SANDBOX_STATE_DIR:-/var/lib/yeaft/container-agents}
