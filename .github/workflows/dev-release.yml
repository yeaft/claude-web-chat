name: Dev Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: dev-release
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Legacy image name for deployments that still pull the pre-rename package.
  LEGACY_IMAGE_NAME: ${{ github.repository_owner }}/claude-web-chat
  AGENT_IMAGE_NAME: ${{ github.repository }}-agent

jobs:
  # Resolve tag/commit for both push and workflow_dispatch triggers.
  # All downstream jobs reference outputs.tag / outputs.commit for consistency.
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and commit
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
            git fetch --tags origin
            TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${TAG}" 2>/dev/null || true)
            if [ -z "$TAG_COMMIT" ]; then
              echo "::error::Requested tag was not found in this repository."
              exit 1
            fi
          else
            TAG="$REF_NAME"
            TAG_COMMIT="$EVENT_SHA"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match v<major>.<minor>.<patch>."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on main
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          TAG="$RELEASE_TAG"
          TAG_COMMIT="$RELEASE_COMMIT"
          echo "Tag: ${TAG}"
          echo "Commit: ${TAG_COMMIT}"

          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo ""
            echo "::error::Tag '${TAG}' points to commit ${TAG_COMMIT} which is NOT on the main branch."
            echo "::error::Tags MUST only be created from the main branch."
            echo ""
            echo "Branches containing this commit:"
            git branch -r --contains "${TAG_COMMIT}"
            exit 1
          fi

          echo "Tag is on main branch."

  test:
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run release guards
        run: npm run release:guard

      - name: Build frontend
        run: npm run build

  publish-agent:
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          VERSION=${RELEASE_TAG#v}
          cd agent && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: cd agent && npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}:dev
          build-args: BUILD_VERSION=${{ needs.validate-tag.outputs.tag }}

      - name: Build and push Agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agent/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}:dev
          build-args: BUILD_VERSION=${{ needs.validate-tag.outputs.tag }}
